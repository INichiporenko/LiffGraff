services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server_docker
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client_docker
    ports:
      - "5173:5173"
    depends_on:
      - server
    env_file:
      - ./client/.env
    environment:
      API_PROXY_TARGET: http://server:3001

